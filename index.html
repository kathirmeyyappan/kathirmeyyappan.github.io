<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kathirm.com</title>
  <meta name="description" content="kathir meyyappan: info, world, anime">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <link rel="preload" as="image" href="assets/elizabeth-walk.gif">
  <link rel="preload" as="image" href="assets/anime.gif">
  <style>
    :root {
      --bg: #07080c;
      --fg: #ece9dc;
      --dim: rgba(236, 233, 220, 0.5);
      --pixel: 'Press Start 2P', 'VT323', monospace;
      --mono: 'VT323', 'Courier New', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at 50% 42%, #12141d 0%, var(--bg) 70%);
      color: var(--fg);
      font-family: var(--mono);
      overflow: hidden;
      -webkit-font-smoothing: none;
    }

    /* CRT overlay: scanlines + vignette over everything */
    .crt {
      position: fixed; inset: 0; z-index: 20; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);
    }
    .crt::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.6) 100%);
    }

    .boot {
      position: fixed; top: 22px; left: 26px; z-index: 5;
      font: 22px/1 var(--mono); color: var(--dim); letter-spacing: 1px;
    }
    .cursor {
      display: inline-block; width: 10px; height: 18px; margin-left: 6px;
      background: var(--dim); vertical-align: -2px;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ---- menu ---- */
    .menu {
      position: fixed; inset: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 0 16px;
    }
    .item {
      position: relative; display: block; width: min(360px, 100%);
      padding: 18px 22px 16px;
      color: var(--fg); text-decoration: none; text-align: center;
      border: 3px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.015);
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      outline: none;
    }
    .item .label {
      position: relative; display: block;
      font: 15px/1 var(--pixel); letter-spacing: 1px;
      transition: color 0.18s ease, text-shadow 0.18s ease;
    }
    .item .sub {
      display: block; margin-top: 10px;
      font: 20px/1 var(--mono); color: var(--dim); letter-spacing: 1px;
      transition: color 0.18s ease;
    }
    /* RPG-menu selector */
    .item::before {
      content: ''; position: absolute; left: -30px; top: 50%;
      border-left: 11px solid var(--accent);
      border-top: 7px solid transparent; border-bottom: 7px solid transparent;
      transform: translate(-10px, -50%); opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .item:hover, .item:focus-visible {
      transform: translate(-3px, -3px);
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 7%, transparent);
      box-shadow: 7px 7px 0 #000, 0 0 30px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .item:hover .label, .item:focus-visible .label {
      color: var(--accent);
      text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    .item:hover .sub, .item:focus-visible .sub { color: var(--fg); }
    .item:hover::before, .item:focus-visible::before {
      opacity: 1; transform: translate(0, -50%);
      animation: blink 0.9s steps(1) infinite 0.4s;
    }
    /* INFO: one phosphor sweep down the button on enter */
    .item::after {
      content: ''; position: absolute; left: 0; right: 0; top: -40%; height: 40%;
      background: linear-gradient(transparent, color-mix(in srgb, var(--accent) 28%, transparent), transparent);
      opacity: 0; pointer-events: none;
    }
    #info:hover::after, #info:focus-visible::after { animation: sweep 0.75s ease-out 1; }
    @keyframes sweep {
      0%   { top: -40%; opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* ---- WORLD: Elizabeth walks across the bottom of the page ---- */
    .walker {
      position: fixed; left: 0; bottom: 96px; z-index: 6;
      width: 108px; height: 120px;
      image-rendering: pixelated;
      filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.55));
      opacity: 0; pointer-events: none; will-change: transform;
      transform: translateX(-130px);
      transition: opacity 0.35s ease;
    }
    .walker.visible { opacity: 1; }
    .walker.walking { animation: walk var(--walk, 12s) linear infinite; }
    @keyframes walk {
      from { transform: translateX(-130px); }
      to   { transform: translateX(100vw); }
    }

    /* ---- ANIME: a CRT television switches on ---- */
    .tv {
      position: fixed; z-index: 6; pointer-events: none; opacity: 0;
      left: calc(50% + 215px); top: 50%; width: 340px; transform: translateY(-50%);
      transition: opacity 0.25s ease 0.4s;
    }
    .tv.show { opacity: 1; transition-delay: 0s; }
    @media (max-width: 1099px) { /* no room beside the menu: sit above it, sized to fit */
      .tv {
        left: 50%; top: 16px; transform: translateX(-50%);
        width: clamp(180px, calc((50vh - 215px) / 0.75), 300px);
      }
    }
    .tv .set {
      background: #1a1922; border-radius: 18px; padding: 14px 14px 26px;
      box-shadow: 7px 7px 0 #000, inset 0 0 0 2px #2b2a36;
      position: relative;
    }
    .tv .led {
      position: absolute; right: 22px; bottom: 9px; width: 8px; height: 8px; border-radius: 50%;
      background: #3a1b22; transition: background 0.3s, box-shadow 0.3s;
    }
    .tv.show .led { background: #ff3d5a; box-shadow: 0 0 8px #ff3d5a; }
    .tv .screen {
      position: relative; aspect-ratio: 4 / 3; overflow: hidden;
      background: #000; border-radius: 16px / 12px;
      transform: scale(1, 0.004); opacity: 0;
    }
    .tv .screen img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      filter: saturate(1.2) contrast(1.08);
    }
    .tv .screen::before { /* scanlines + aperture */
      content: ''; position: absolute; inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.3) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(255, 0, 80, 0.05) 0 1px, rgba(0, 255, 120, 0.05) 1px 2px, rgba(0, 120, 255, 0.05) 2px 3px);
    }
    .tv .screen::after { /* glass glare + edge darkening */
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 28% 18%, rgba(255, 255, 255, 0.16), transparent 50%);
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.75);
    }
    .tv .osd {
      position: absolute; top: 10px; left: 16px; z-index: 2;
      font: 22px/1 var(--mono); color: #7dff8a; text-shadow: 0 0 6px #7dff8a; opacity: 0;
    }
    .tv .screen.on { animation: tv-on 0.6s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
    .tv .screen.on .osd { animation: osd 2.6s ease-out 0.4s forwards; }
    .tv .screen.off { animation: tv-off 0.45s ease-in forwards; }
    @keyframes tv-on {
      0%   { transform: scale(1, 0.004); opacity: 1; filter: brightness(12); }
      30%  { transform: scale(1, 0.02);  opacity: 1; filter: brightness(7); }
      62%  { transform: scale(1, 1.02);  opacity: 1; filter: brightness(2); }
      100% { transform: scale(1, 1);     opacity: 1; filter: brightness(1); }
    }
    @keyframes tv-off {
      0%   { transform: scale(1, 1);       opacity: 1; filter: brightness(1); }
      45%  { transform: scale(1, 0.006);   opacity: 1; filter: brightness(9); }
      75%  { transform: scale(0.03, 0.006); opacity: 1; filter: brightness(14); }
      100% { transform: scale(0, 0.006);   opacity: 0; filter: brightness(0); }
    }
    @keyframes osd { 0% { opacity: 0; } 10% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }

    /* ---- socials ---- */
    .socials {
      position: fixed; left: 0; right: 0; bottom: 30px; z-index: 5;
      display: flex; justify-content: center; gap: 32px;
    }
    .socials a {
      color: var(--fg); opacity: 0.26; display: block;
      transition: opacity 0.2s ease, transform 0.2s ease, filter 0.2s ease;
    }
    .socials a:hover, .socials a:focus-visible {
      opacity: 1; transform: translateY(-3px); outline: none;
      filter: drop-shadow(0 0 7px rgba(236, 233, 220, 0.6));
    }
    .socials svg { width: 22px; height: 22px; fill: currentColor; display: block; }

    @media (max-width: 520px) {
      .boot { top: 16px; left: 16px; font-size: 18px; }
      .item .label { font-size: 13px; }
      .item::before { display: none; }
      .walker { bottom: 84px; }
      .socials { bottom: 24px; gap: 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .walker.walking { animation: none; transform: translateX(24px); }
      .tv .screen.on { animation: none; transform: none; opacity: 1; }
      .tv .screen.off { animation: none; opacity: 0; }
      .item::before, .cursor { animation: none; }
      #info:hover::after, #info:focus-visible::after { animation: none; }
    }
  </style>
</head>

  <script>
    (() => {
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Hover/focus → "hot". Pointer events cover mouse; focus covers keyboard.
      const bind = (el, on, off) => {
        el.addEventListener('pointerenter', on);
        el.addEventListener('pointerleave', off);
        el.addEventListener('focus', on);
        el.addEventListener('blur', off);
      };

      // ---- INFO: the sublabel decodes into a different line, then back ----
      const GLYPHS = '!<>-_\\/[]{}=+*^?#%&@$';
      const sub = document.querySelector('#info .sub');
      let raf = 0;
      const scramble = (to, dur = 650) => {
        cancelAnimationFrame(raf);
        if (reduced) { sub.textContent = to; return; }
        const from = sub.textContent;
        const n = Math.max(from.length, to.length);
        const start = performance.now();
        const t0 = Array.from({ length: n }, (_, i) => (i / n) * dur * 0.55 + Math.random() * dur * 0.2);
        const t1 = t0.map((t) => t + 90 + Math.random() * 220);
        const frame = (now) => {
          const t = now - start;
          let out = '', done = true;
          for (let i = 0; i < n; i++) {
            if (t >= t1[i]) out += to[i] ?? '';
            else if (t >= t0[i]) { out += GLYPHS[(Math.random() * GLYPHS.length) | 0]; done = false; }
            else { out += from[i] ?? ' '; done = false; }
          }
          sub.textContent = out;
          if (!done) raf = requestAnimationFrame(frame);
        };
        raf = requestAnimationFrame(frame);
      };
      // data-hot holds HTML entities; resolve them once through a scratch element.
      { const s = document.createElement('span'); s.innerHTML = sub.dataset.hot; sub.dataset.hot = s.textContent; }
      bind(document.getElementById('info'),
        () => scramble(sub.dataset.hot),
        () => scramble(sub.dataset.rest));

      // ---- WORLD: Elizabeth walks across the bottom ----
      const walker = document.querySelector('.walker');
      const pace = () => walker.style.setProperty('--walk', ((innerWidth + 130) / 140) + 's');
      pace(); addEventListener('resize', pace);
      let hideTimer = 0;
      bind(document.getElementById('world'), () => {
        clearTimeout(hideTimer);
        walker.classList.add('walking', 'visible');
      }, () => {
        walker.classList.remove('visible');
        hideTimer = setTimeout(() => walker.classList.remove('walking'), 400);
      });

      // ---- ANIME: the TV switches on ----
      const tv = document.querySelector('.tv');
      const screen = tv.querySelector('.screen');
      bind(document.getElementById('anime'), () => {
        screen.classList.remove('off'); screen.classList.add('on');
        tv.classList.add('show');
      }, () => {
        screen.classList.remove('on'); screen.classList.add('off');
        tv.classList.remove('show');
      });
    })();
  </script>
